name: Cypress Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    environment: teste
    env:
      AUTOMATIONEXERCISE_EMAIL: ${{ secrets.EMAIL }}
      AUTOMATIONEXERCISE_PASSWORD: ${{ secrets.PASSWORD }}
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          if [ -z "${AUTOMATIONEXERCISE_EMAIL}" ] || [ -z "${AUTOMATIONEXERCISE_PASSWORD}" ]; then
            echo "Missing required secrets for Automation Exercise" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npm test
