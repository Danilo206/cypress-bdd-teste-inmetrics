name: Cypress Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    env:
      AUTOMATIONEXERCISE_EMAIL: ${{ secrets.AUTOMATIONEXERCISE_EMAIL || secrets.EMAIL }}
      AUTOMATIONEXERCISE_PASSWORD: ${{ secrets.AUTOMATIONEXERCISE_PASSWORD || secrets.SENHA }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npm test
