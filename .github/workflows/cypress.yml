name: Cypress Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    environment: teste
    env:
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      TRELLO_ACTION_ID: ${{ secrets.TRELLO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          if [ -z "${EMAIL}" ] || [ -z "${PASSWORD}" ]; then
            echo "Missing required secrets for Automation Exercise" >&2
            exit 1
          fi

          if [ -z "${TRELLO_ACTION_ID}" ]; then
            echo "Missing required Trello secret" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests with Allure
        run: npm run test:smoke -- --env allure=true

      - name: Generate Allure report
        run: npm run allure:report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error
