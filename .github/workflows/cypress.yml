name: Cypress Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    environment: teste
    env:
      AUTOMATIONEXERCISE_EMAIL: ${{ secrets.EMAIL }}
      AUTOMATIONEXERCISE_PASSWORD: ${{ secrets.PASSWORD }}
      TRELLO_ACTION_ID: ${{ secrets.TRELLO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          [ -n "${AUTOMATIONEXERCISE_EMAIL}" ] || exit 1
          [ -n "${AUTOMATIONEXERCISE_PASSWORD}" ] || exit 1
          [ -n "${TRELLO_ACTION_ID}" ] || exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests with Allure
        run: npm run test:allure

      - name: Generate Allure report
        run: npm run allure:report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error
